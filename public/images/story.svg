<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.14" />
      <stop offset="1" stop-color="#f97316" stop-opacity="0.06" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#f8faf9" />

  <!-- Decorative circles -->
  <circle cx="160" cy="140" r="100" fill="#ecfccb" />
  <circle cx="1040" cy="760" r="160" fill="#fff7ed" />

  <!-- Stylized storefront -->
  <g transform="translate(200,220)">
    <rect x="0" y="120" width="520" height="300" rx="18" fill="#ffffff" stroke="#e6e6e6" />
    <rect x="18" y="30" width="120" height="80" rx="10" fill="#16a34a" />
    <text x="78" y="82" font-family="Segoe UI, Roboto, sans-serif" font-size="28" text-anchor="middle" fill="#fff">KP</text>
    <!-- Awning -->
    <g>
      <path d="M-10 120 Q80 40 200 120 T420 120" fill="#ef4444" />
      <path d="M0 120 Q80 50 200 120 T420 120" fill="#f97316" opacity="0.95"/>
    </g>
    <!-- Door and windows -->
    <rect x="60" y="180" width="120" height="160" rx="8" fill="#f3f4f6" />
    <rect x="260" y="180" width="120" height="110" rx="8" fill="#fff" />
    <rect x="260" y="300" width="120" height="40" rx="6" fill="#eef2ff" />
  </g>

  <!-- Food plate illustration -->
  <g transform="translate(760,260)">
    <circle cx="80" cy="90" r="70" fill="#fff8f0" stroke="#fee2b3" />
    <circle cx="80" cy="90" r="40" fill="#fff1f0" />
    <path d="M40 120 q40 -80 80 0" stroke="#f97316" stroke-width="10" fill="none" stroke-linecap="round" />
    <circle cx="60" cy="80" r="6" fill="#16a34a" />
    <circle cx="100" cy="80" r="6" fill="#16a34a" />
  </g>

  <!-- Text label -->
  <text x="120" y="550" font-family="Segoe UI, Roboto, sans-serif" font-size="32" fill="#065f46" font-weight="700">Perjalanan Kedai Prasmar</text>
  <text x="120" y="590" font-family="Segoe UI, Roboto, sans-serif" font-size="16" fill="#6b7280">Dari dapur kecil hingga dipercaya ribuan pelanggan setia</text>

  <!-- Gradient overlay -->
  <rect width="1200" height="900" fill="url(#g1)" />
</svg>